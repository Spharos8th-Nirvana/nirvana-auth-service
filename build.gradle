plugins {
    id 'java'
    id 'org.springframework.boot' version '4.1.2'
}

group = 'com.nirvana'
version = '0.0.1-SNAPSHOT'

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    implementation platform('org.springframework.cloud:spring-cloud-dependencies:2025.1.4')
    implementation 'org.springframework.boot:spring-boot-starter-webmvc'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-mail'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'
    implementation 'org.springframework.boot:spring-boot-starter-kafka'
    implementation 'org.springframework.security:spring-security-crypto'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-jdbc'
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'org.springframework.cloud:spring-cloud-starter-config'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.2.0'

    annotationProcessor platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    compileOnly platform(org.springframework.boot.gradle.plugin.SpringBootPlugin.BOM_COORDINATES)
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    //jpa
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

def snippetsDir = layout.buildDirectory.dir('generated-snippets')

tasks.named('test') {
    useJUnitPlatform()
    inputs.property('authTestRedisPort', providers.environmentVariable('AUTH_TEST_REDIS_PORT').orElse(''))
    outputs.dir(snippetsDir)
}

def restDocs = tasks.register('restDocs') {
    group = 'documentation'
    description = 'Assembles API contract examples generated by Spring REST Docs.'
    dependsOn(tasks.named('test'))
    inputs.dir(snippetsDir)
    def document = layout.buildDirectory.file('docs/auth-api.md')
    outputs.file(document)
    doLast {
        def scenarios = [
            'send/accepted': '인증번호 발송 · 204',
            'send/invalid-request': '인증번호 발송 · 400 INVALID_REQUEST',
            'send/invalid-json': '인증번호 발송 · 400 INVALID_JSON',
            'send/email-already-used': '인증번호 발송 · 409 EMAIL_ALREADY_USED',
            'send/resend-too-soon': '인증번호 발송 · 429 EMAIL_RESEND_TOO_SOON',
            'send/delivery-failed': '인증번호 발송 · 503 EMAIL_DELIVERY_FAILED',
            'verify/verified': '인증번호 검증 · 200',
            'verify/invalid-code': '인증번호 검증 · 400 INVALID_EMAIL_VERIFICATION_CODE',
            'signup/created': '회원가입 · 201',
            'signup/invalid-token': '회원가입 · 400 INVALID_EMAIL_VERIFICATION_TOKEN',
            'signup/invalid-request': '회원가입 · 400 INVALID_REQUEST',
            'signup/email-already-used': '회원가입 · 409 EMAIL_ALREADY_USED',
            'signup/internal-error': '회원가입 · 500 INTERNAL_SERVER_ERROR'
        ]
        def sections = scenarios.collect { scenario, heading ->
            def directory = snippetsDir.get().dir("auth/$scenario")
            def request = directory.file('http-request.md').asFile.getText('UTF-8')
            def response = directory.file('http-response.md').asFile.getText('UTF-8')
            "## $heading\n\n### 요청\n\n$request\n\n### 응답\n\n$response"
        }
        def output = document.get().asFile
        output.parentFile.mkdirs()
        output.setText("# Auth 이메일 회원가입 API\n\n" + sections.join('\n\n'), 'UTF-8')
    }
}

tasks.named('check') {
    dependsOn(restDocs)
}
